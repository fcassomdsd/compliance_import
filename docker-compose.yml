services:
  compliance-import:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BIND_IP:-0.0.0.0}:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Container hardening (P3.2).
    #
    # read_only: the image already runs as the non-root `appuser` (see the
    # Dockerfile) and the service writes nothing to its own filesystem except
    # the temporary directory it extracts uploads into, so the root filesystem
    # can be immutable. /tmp is a tmpfs sized to hold one upload: the ZIP-bomb
    # limits cap an extraction at MAX_EXTRACTED_TOTAL_SIZE (500 MB default),
    # and a tmpfs that is too small fails the upload rather than the container.
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      # /health is exempt from the API-key middleware precisely so this works.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      IMPORT_API_KEY: ${IMPORT_API_KEY:-}
      ALFRESCO_URL: ${ALFRESCO_URL:-http://proxy:8080/alfresco/api/-default-/public/alfresco/versions/1}
      ALFRESCO_CANONICAL_JSON_PATH: ${ALFRESCO_CANONICAL_JSON_PATH:-Sites/vigilancia-de-la-so/documentLibrary/Vigilancia/Datos de campo}
      ALFRESCO_TIMEOUT_SECONDS: ${ALFRESCO_TIMEOUT_SECONDS:-20}
      ALFRESCO_RETRY_TOTAL: ${ALFRESCO_RETRY_TOTAL:-3}
      ALFRESCO_RETRY_CONNECT: ${ALFRESCO_RETRY_CONNECT:-3}
      ALFRESCO_RETRY_STATUS: ${ALFRESCO_RETRY_STATUS:-3}
      ALFRESCO_RETRY_BACKOFF_SECONDS: ${ALFRESCO_RETRY_BACKOFF_SECONDS:-0.5}
      # Structured logging (P3.5). `json` or `text`; unset it follows APP_ENV.
      # JSON is what makes these logs queryable by field in Loki rather than
      # only greppable, and it carries a request_id so one upload's lines can
      # be told from another's under concurrent load.
      APP_ENV: ${APP_ENV:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
    networks:
      - import-backend
      - alfresco-backend
    secrets:
      - source: alfresco_username
        target: alfresco_username
      - source: alfresco_password
        target: alfresco_password

networks:
  import-backend:
    name: import-backend
  alfresco-backend:
    name: alfresco_backend
    external : true

secrets:
  alfresco_username:
    file: ./docker/secrets/alfresco_username.txt
  alfresco_password:
    file: ./docker/secrets/alfresco_password.txt
