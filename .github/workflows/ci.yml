name: CI

# Mirror of this repository's GitLab CI validation job, published on GitHub purely for public
# visibility (GitLab remains the source of truth for development — see CONTRIBUTING.md). Only
# the correctness-signal job is mirrored here; release automation stays GitLab-only.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  test-unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: python -m unittest discover -s tests

  security-scan:
    # Supply-chain scanning (P3.2). Gate policy chosen from measurement:
    # CRITICAL is blocking (measured at zero across all six repos, so the gate
    # is green today and stops regressions); HIGH is reported but not blocking
    # while 33 known-fixable findings are cleared, because a gate that is red
    # on arrival gets switched off, and a disabled gate still reads as
    # protection. --skip-dirs excludes generated/bind-mounted runtime trees.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '1'
      - name: Report HIGH (non-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '0'
