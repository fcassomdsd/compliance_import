name: CI

# Mirror of this repository's GitLab CI validation job, published on GitHub purely for public
# visibility (GitLab remains the source of truth for development — see CONTRIBUTING.md). Only
# the correctness-signal job is mirrored here; release automation stays GitLab-only.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  test-unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: python -m unittest discover -s tests

  security-scan:
    # Supply-chain scanning (P3.2). Gate policy chosen from measurement:
    # CRITICAL and HIGH both block, fixable-only. P3.2 shipped with HIGH merely
    # reported while 33 fixable findings were cleared, because a gate that is
    # red on arrival gets switched off and a disabled gate still reads as
    # protection. That backlog is cleared (0/0 across all six repos,
    # 2026-09-29), so the bar rises. --ignore-unfixed keeps an unfixable new
    # advisory from blocking anyone; a fixable one that cannot be taken now
    # goes in .trivyignore with a reason and a date, never by weakening this
    # job. --skip-dirs excludes generated/bind-mounted runtime trees.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report CRITICAL and HIGH
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '0'
      - name: Fail on any fixable CRITICAL or HIGH
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '1'
