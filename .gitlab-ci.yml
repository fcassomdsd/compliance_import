stages:
  - test
  - release

# The unittest suite existed but never ran in CI. Python matches the
# python:3.12 base image used by the Dockerfile.
test:unittest:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir -r requirements-dev.txt
    - python -m unittest discover -s tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Supply-chain scanning (P3.2). No repository had any security scanning before
# this.
#
# Gate policy, chosen from measurement rather than aspiration:
#
#   CRITICAL -> blocking.   Measured across all six repos on 2026-09-26: zero.
#                           So this gate is green today and genuinely stops a
#                           regression, rather than being red on arrival.
#   HIGH     -> reported.   33 findings exist today (21 in compliance_web, 12
#                           in compliance_checklist), all with fixes available.
#                           Blocking on HIGH immediately would red every
#                           pipeline in those two repos and the gate would be
#                           switched off within a day -- which is worse than no
#                           gate, because a disabled gate still reads as
#                           protection. Clear the backlog, then raise the bar
#                           here to HIGH,CRITICAL.
#
# --ignore-unfixed: a CVE with no available fix is information, not an action.
# The scan is skipped on scheduled pipelines so a new CVE disclosure cannot
# turn an unrelated nightly run red.
# ---------------------------------------------------------------------------
security:scan:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  # This job brings its own image, so it must opt out of any global or
  # `default:` before_script. compliance_checklist's runs `npm ci` and
  # atrocore-docker's calls the Docker CLI -- neither exists in the Trivy
  # image, and both fail the job before the scan starts. Declared here for
  # every repo, not just the two that have one today, so adding a global
  # before_script later cannot silently break this job.
  before_script: []
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths: [.trivycache]
  script:
    # Blocking on CRITICAL **and** HIGH, both fixable-only.
    #
    # P3.2 shipped this with HIGH merely reported, because 33 fixable HIGH
    # findings existed and a gate that is red on arrival gets switched off
    # within a day -- and a disabled gate is worse than none, because it
    # still reads as protection. That backlog is now cleared: 0 CRITICAL and
    # 0 HIGH across all six repositories, measured 2026-09-29. So the bar
    # rises, which was the stated plan.
    #
    # --ignore-unfixed is what makes this survivable. A newly disclosed
    # advisory with no fix available does not block anyone; only one that
    # could be acted on does.
    #
    # When a fixable HIGH lands that genuinely cannot be taken right now,
    # add it to .trivyignore WITH A REASON AND A DATE -- do not weaken this
    # job. An exception that is written down and reviewed is a decision; a
    # lowered threshold is an outage of the control.
    #
    # --skip-dirs excludes generated and bind-mounted runtime trees, not
    # source. web-data/ in particular is the AtroCore application installed
    # at container bootstrap: gitignored, absent from a fresh checkout, and
    # vendoring its own npm tree, so scanning it here would report upstream's
    # dependencies as if they were this repository's.

    # Report first, so a failing pipeline still leaves something readable.
    - trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore --skip-dirs web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage --exit-code 0 --format table -o trivy-findings.txt .
    - cat trivy-findings.txt
    # SBOM before the gate, for the same reason: it must exist even when the
    # scan fails. CycloneDX is the format the release process will consume
    # once images are published and signed.
    - trivy fs --format cyclonedx --skip-dirs web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage -o sbom.cdx.json .
    # The gate itself, last.
    - trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore --skip-dirs web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage --exit-code 1 .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-findings.txt
      - sbom.cdx.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Releases are CalVer-tagged from CHANGELOG.md and gated on a prepared release
# entry: the tag is the date of the newest "## [YYYY-MM-DD]" section, the
# pipeline fails when that section is missing, when CHANGELOG.md is unchanged
# since the previous release, or when the tag already exists. The CHANGELOG is
# the release trigger: a merge to the default branch that does not touch
# CHANGELOG.md produces no release. See scripts/release-tag.sh and
# CONTRIBUTING.md ("Versioning and releases").
compute_release_tag:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - CHANGELOG.md
  script:
    - sh scripts/release-tag.test.sh
    - sh scripts/release-tag.sh --env-file release.env
  artifacts:
    reports:
      dotenv: release.env

create_release:
  stage: release
  needs: ["compute_release_tag"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - CHANGELOG.md
  script:
    - echo "Creating release $RELEASE_TAG"
  release:
    tag_name: '$RELEASE_TAG'
    ref: '$CI_COMMIT_SHA'
    description: 'See CHANGELOG.md for the changes in $RELEASE_TAG'
